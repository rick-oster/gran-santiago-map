name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_smoke:
    name: windows-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PowerShell entrypoint and frozen spec
        shell: pwsh
        run: ./scripts/Test-WindowsDev.ps1
      - name: Verify Windows Git status entrypoint
        shell: pwsh
        run: ./scripts/Windows-Dev.ps1 -Action Status
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Verify Windows build and unit tests
        shell: pwsh
        run: ./scripts/Windows-Dev.ps1 -Action Check

  validate:
    name: validate
    needs: windows_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Verify frozen spec and repository layout
        id: static
        run: npm run check:static
      - name: TypeScript typecheck
        id: typecheck
        run: npm run typecheck
      - name: Prepare evidence directory
        run: mkdir -p evidence
      - name: Unit tests
        id: unit
        run: npm run test:unit:ci
      - name: Build production site
        id: build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Install Playwright Chromium
        id: browser_setup
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile-emulated end-to-end tests
        id: e2e
        run: npm run test:e2e
      - name: Write machine-readable CI receipt
        if: always()
        env:
          M0_INSTALL: ${{ steps.install.outcome }}
          M0_STATIC: ${{ steps.static.outcome }}
          M0_TYPECHECK: ${{ steps.typecheck.outcome }}
          M0_UNIT: ${{ steps.unit.outcome }}
          M0_BUILD: ${{ steps.build.outcome }}
          M0_BROWSER_SETUP: ${{ steps.browser_setup.outcome }}
          M0_E2E: ${{ steps.e2e.outcome }}
        run: node scripts/write-ci-receipt.mjs
      - name: Upload CI test receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-ci-evidence-${{ github.run_id }}
          path: |
            evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Package site for GitHub Pages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: deploy
    needs: validate
    if: needs.validate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
